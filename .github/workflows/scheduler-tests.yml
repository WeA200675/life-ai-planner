name: Scheduler tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic offline tests
        run: python -m unittest discover -s tests -v
      - name: Capture synthetic scheduler baseline (informational)
        run: python -m tools.benchmark_scheduler --sizes 100 1000 10000 --repeats 5 --warmup 1 --output scheduler-benchmark.json
      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-benchmark-${{ github.run_id }}
          path: scheduler-benchmark.json
          if-no-files-found: warn
          retention-days: 14

name: Flutter offline MVP checks
on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:
jobs:
  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Reuse resolved Gradle artifacts across builds to reduce Maven Central
      # requests and mitigate transient HTTP 429 responses. A cache miss still
      # uses normal Gradle resolution and must never turn a failure green.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Report toolchain versions
        run: |
          flutter --version
          java -version
      - name: Generate Android platform scaffold when absent
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --no-pub --platforms=android --project-name life_ai_planner .
            # The generated template test targets MyApp, not this project's PlannerApp.
            rm -f test/widget_test.dart
          fi
          test -f android/app/src/main/AndroidManifest.xml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build Android debug APK (bounded dependency-network retries)
        shell: bash
        run: |
          set -euo pipefail
          # Maven Central/Gradle Plugin Portal occasionally return transient 403/5xx.
          # Never suppress the final failure or upload an APK from an earlier attempt.
          rm -f build/app/outputs/flutter-apk/app-debug.apk
          for attempt in 1 2 3; do
            if flutter build apk --debug; then
              test -s build/app/outputs/flutter-apk/app-debug.apk
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android build failed after 3 attempts; inspect Gradle dependency HTTP responses."
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Verify APK and record SHA-256
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" > /dev/null
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: life-ai-planner-debug-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

name: Flutter offline MVP checks
on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:
jobs:
  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Report toolchain versions
        run: |
          flutter --version
          java -version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Generate missing Android platform scaffold
        run: flutter create --platforms=android --project-name life_ai_planner .
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: life-ai-planner-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

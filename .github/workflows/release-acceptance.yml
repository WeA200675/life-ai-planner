name: Release acceptance candidate
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'services/**'
      - 'tests/**'
      - '.github/workflows/release-acceptance.yml'
      - 'docs/RELEASE_ACCEPTANCE_*.md'
concurrency:
  group: release-acceptance-${{ github.ref }}
  # Preserve expensive acceptance runs for their exact commit SHA. New pushes
  # must not cancel in-flight evidence collection or debug APK generation.
  cancel-in-progress: false
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f services/api/requirements.txt ]; then pip install -r services/api/requirements.txt; fi
      - name: Run repository regression tests and retain evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          python -m compileall -q packages services tests 2>&1 | tee acceptance-evidence/python-compile.log
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee acceptance-evidence/python-tests.log
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-ai-planner-backend-test-evidence
          path: acceptance-evidence/
          if-no-files-found: warn
          retention-days: 14
  # Independent smoke-test artifact: a native flutter_tester crash must not
  # prevent producing a clearly marked, unapproved device-test APK.
  debug-test-apk:
    # Build a clearly unapproved test artifact immediately, in parallel with
    # backend validation; production acceptance still requires all gates.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android project
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --no-pub --platforms=android --project-name life_ai_planner .
            rm -f test/widget_test.dart
          fi
          test -f android/app/src/main/AndroidManifest.xml
      - name: Capture Android build environment
        shell: bash
        run: |
          mkdir -p acceptance-evidence
          flutter --version 2>&1 | tee acceptance-evidence/flutter-version.log
          java -version 2>&1 | tee acceptance-evidence/java-version.log
          flutter doctor -v > acceptance-evidence/flutter-doctor.log 2>&1 || true
      - name: Build isolated debug smoke-test APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          # Each command is guarded independently so the exact failure is
          # retained in both the artifact and the Actions step summary.
          if ! flutter pub get > acceptance-evidence/debug-pub-get.log 2>&1; then
            cat acceptance-evidence/debug-pub-get.log
            echo '::error::Debug APK blocked by flutter pub get; inspect debug-pub-get.log.'
            echo '### Debug APK: dependency resolution failed (NO-GO)' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! timeout --signal=TERM --kill-after=30s 30m flutter build apk --debug --no-pub > acceptance-evidence/android-debug-build.log 2>&1; then
            cat acceptance-evidence/android-debug-build.log
            echo '::error::Debug APK compilation failed; inspect android-debug-build.log.'
            echo '### Debug APK: compilation failed (NO-GO)' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          apk=build/app/outputs/flutter-apk/app-debug.apk
          if [ ! -s "$apk" ] || ! unzip -t "$apk" > /dev/null; then
            echo '::error::Debug APK missing, empty or invalid ZIP.'
            echo '### Debug APK: integrity check failed (NO-GO)' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          (cd build/app/outputs/flutter-apk && sha256sum app-debug.apk > app-debug.apk.sha256)
          (cd build/app/outputs/flutter-apk && sha256sum --check app-debug.apk.sha256)
          echo '### Debug APK: built and ZIP/SHA256 verified (device acceptance pending)' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish UNVERIFIED debug device-test APK and digest
        uses: actions/upload-artifact@v4
        with:
          name: life-ai-planner-debug-test-only
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload isolated debug build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-ai-planner-debug-build-diagnostics
          path: |
            apps/mobile/acceptance-evidence/debug-pub-get.log
            apps/mobile/acceptance-evidence/android-debug-build.log
            apps/mobile/acceptance-evidence/flutter-version.log
            apps/mobile/acceptance-evidence/java-version.log
            apps/mobile/acceptance-evidence/flutter-doctor.log
          if-no-files-found: warn
          retention-days: 14

  android-release:
    # Validation always runs; production packaging only when certificate pin is set.
    # A missing production signing configuration is not a failed debug APK build.
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android project
        run: |
          set -euo pipefail
          flutter --version
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --no-pub --platforms=android --project-name life_ai_planner .
            rm -f test/widget_test.dart
          fi
          test -f android/app/src/main/AndroidManifest.xml
      - name: Dependencies and static analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          flutter pub get 2>&1 | tee acceptance-evidence/flutter-pub-get.log
          flutter analyze --no-fatal-infos 2>&1 | tee acceptance-evidence/flutter-analyze.log
      - name: Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          # Keep modest parallelism to reduce test wall time while limiting
          # flutter_tester memory pressure after the prior native crash.
          # A global watchdog prevents a crashed tester from blocking the runner.
          set +e
          timeout --signal=TERM --kill-after=30s 12m flutter test --coverage --concurrency=2 --timeout=90s --reporter expanded 2>&1 | tee acceptance-evidence/flutter-tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -eq 124 ] || [ "$test_status" -eq 137 ]; then
            echo "::error::Flutter tests failed to finish within the bounded execution time (status $test_status)." | tee -a acceptance-evidence/flutter-tests.log
          fi
          exit "$test_status"
      - name: Upload Flutter test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-ai-planner-flutter-test-evidence
          path: |
            apps/mobile/acceptance-evidence/flutter-pub-get.log
            apps/mobile/acceptance-evidence/flutter-analyze.log
            apps/mobile/acceptance-evidence/flutter-tests.log
            apps/mobile/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
      - name: Explain unconfigured production signing gate
        if: ${{ vars.ANDROID_RELEASE_CERT_SHA256 == '' }}
        run: |
          echo '### Production release: NOT CONFIGURED (NO-GO)' >> "$GITHUB_STEP_SUMMARY"
          echo 'ANDROID_RELEASE_CERT_SHA256 is absent. Tests continue, but no release APK is built or published.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build release-mode candidate (signing status unverified)
        if: ${{ vars.ANDROID_RELEASE_CERT_SHA256 != '' }}
        run: |
          set -euo pipefail
          rm -f build/app/outputs/flutter-apk/app-release.apk
          flutter build apk --release --no-shrink 2>&1 | tee acceptance-evidence/android-release-build.log
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          unzip -t "$apk" > /dev/null
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"
      - name: Upload release build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-ai-planner-release-build-diagnostics
          path: apps/mobile/acceptance-evidence/android-release-build.log
          if-no-files-found: warn
          retention-days: 14
      - name: Inspect candidate signing certificate
        if: ${{ vars.ANDROID_RELEASE_CERT_SHA256 != '' }}
        env:
          EXPECTED_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          # Release mode does not imply unsigned or production-signed. The
          # generated Flutter Android scaffold may use the debug keystore.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          mapfile -t signers < <(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V)
          test "${#signers[@]}" -gt 0
          "${signers[${#signers[@]}-1]}" verify --verbose --print-certs "$apk" > build/app/outputs/flutter-apk/signing-certificate.txt
          cat build/app/outputs/flutter-apk/signing-certificate.txt
          if grep -Eiq 'CN=Android Debug|Android Debug' build/app/outputs/flutter-apk/signing-certificate.txt; then
            echo '::error::Release-mode APK uses a debug signing identity; production release gate failed.'
            exit 1
          fi
          # Reject unknown/self-signed identities even if their subject does not
          # contain "Android Debug". Pin the trusted release certificate digest
          # in a repository/environment variable, never a private key.
          expected="$EXPECTED_RELEASE_CERT_SHA256"
          if [ -z "$expected" ]; then
            echo '::error::ANDROID_RELEASE_CERT_SHA256 is not configured; fail closed.'
            exit 1
          fi
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/app/outputs/flutter-apk/signing-certificate.txt | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$expected" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if ! [[ "$actual" =~ ^[0-9a-f]{64}$ && "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::Missing or malformed release certificate SHA-256 digest.'
            exit 1
          fi
          # Do not accept a second, unpinned signing identity. Android APKs
          # may contain multiple signers; checking only Signer #1 is insufficient.
          signer_count=$(grep -Ec '^Signer #[0-9]+ certificate SHA-256 digest:' build/app/outputs/flutter-apk/signing-certificate.txt || true)
          if [ "$signer_count" -ne 1 ]; then
            echo "::error::Expected exactly one APK signing certificate; found $signer_count."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo '::error::APK signer does not match pinned production certificate.'
            exit 1
          fi
          echo 'Production certificate fingerprint matched pinned SHA-256.'

      # Preserve certificate evidence after a failed signing gate, but never
      # publish an APK artifact that did not pass every preceding check.
      - name: Upload signing diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-ai-planner-release-signing-diagnostics
          path: apps/mobile/build/app/outputs/flutter-apk/signing-certificate.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified release candidate and digest
        if: ${{ success() && vars.ANDROID_RELEASE_CERT_SHA256 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: life-ai-planner-release-candidate-signature-verified
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
